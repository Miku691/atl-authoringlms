services:
  # 1. Elasticsearch Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200" # Host: 9200 (For Kibana/Testing)
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # 2. Kibana Service
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.1
    container_name: kibana
    ports:
      - "5601:5601" # Host: 5601 (Your browser UI)
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # 3. Logstash Service
  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: logstash
    command: logstash -f /usr/share/logstash/config/logstash.conf
    ports:
      - "5044:5044" # ⭐️ CRITICAL: Map the input port to your host machine
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/config/logstash.conf
    depends_on:
      - elasticsearch

volumes:
  esdata: