spring.application.name=ims-instructor-service
# server.servlet.context-path=/ims-instructor
server.port=8085

#MySql Database Config
spring.datasource.url=${INSTRUCTOR_MYSQL_URI}
spring.datasource.username=${INSTRUCTOR_MYSQL_USER}
spring.datasource.password=${INSTRUCTOR_MYSQL_PASS}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30