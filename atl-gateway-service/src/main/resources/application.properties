spring.application.name=atl-gateway-service
server.servlet.context-path=/atl-gateway
# JWT Secret
atl.jwt.secret=${AUTH_JWT_SECRET}

# Route to course-service
spring.cloud.gateway.routes[0].id=atl-course-service
spring.cloud.gateway.routes[0].uri=http://localhost:8082

# Match full path including context path
spring.cloud.gateway.routes[0].predicates[0]=Path=/atl-gateway/atl-courses/**

# Rewrite to /atl/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/atl-gateway/atl-courses/(?<segment>.*), /atl/${segment}


#Redirect to MCQ Service.
spring.cloud.gateway.routes[1].id=atl-mcq-service
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/atl-gateway/atl-mcq/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/atl-gateway/atl-mcq/(?<segment>.*), /mcq/${segment}
