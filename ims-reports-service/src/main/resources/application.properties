spring.application.name=ims-reports-service
server.port=8091
spring.profiles.active=dev

# MySql Database Config (ims_reports_db uses views from other databases)
spring.datasource.url=${REPORTS_DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# For reporting, we never create/update the schema automatically since it relies on views 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30

# File upload/download processing boundaries
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
