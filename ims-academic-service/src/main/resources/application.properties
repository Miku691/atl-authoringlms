spring.application.name=ims-academic-service
# server.servlet.context-path=/ims-academic
server.port=8087

#MySql Database Config
spring.datasource.url=${ACADEMIC_MYSQL_URI}
spring.datasource.username=${ACADEMIC_MYSQL_USER}
spring.datasource.password=${ACADEMIC_MYSQL_PASS}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30