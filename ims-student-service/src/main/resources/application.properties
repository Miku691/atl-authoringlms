spring.application.name=ims-student-service
# server.servlet.context-path=/ims-student
server.port=8084
spring.profiles.active=dev

#MySql Database Config
spring.datasource.url=${STUDENT_MYSQL_URI}
spring.datasource.username=${STUDENT_MYSQL_USER}
spring.datasource.password=${STUDENT_MYSQL_PASS}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30

# File Storage
file.upload-dir=d:/ATL/uploads