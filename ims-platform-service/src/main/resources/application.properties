spring.application.name=ims-platform-service
server.port=8092

# MySql Database Config
spring.datasource.url=${PLATFORM_MYSQL_URI:jdbc:mysql://localhost:3306/ims-platform-db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${PLATFORM_MYSQL_USER:root}
spring.datasource.password=${PLATFORM_MYSQL_PASS:password}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret for security
atl.jwt.secret=${AUTH_JWT_SECRET:secret}

# Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30

# Logging
logging.level.com.ims.platform=DEBUG
