spring.application.name=ims-platform-service
server.port=8092

# MySql Database Config
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/ims-platform-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret for security
atl.jwt.secret=${AUTH_JWT_SECRET:secret}

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30

# Logging
logging.level.com.ims.platform=DEBUG

# Razorpay Config
atl.razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
atl.razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_placeholder_secret}
